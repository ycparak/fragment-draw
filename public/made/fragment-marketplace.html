* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: rgb(var(--colour-canvas)); }
body { font: 14px/18px FragmentMono, ui-monospace, monospace; font-feature-settings: "ss01" on; color: rgb(var(--colour-main)); background: rgb(var(--colour-canvas)); -webkit-font-smoothing: antialiased; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
.top { display: flex; justify-content: space-between; color: rgb(var(--colour-main-500)); padding-bottom: 9px; }
.wordmark { color: rgb(var(--colour-main)); font-size: 11.5px; letter-spacing: .02em; }
#plate { background: rgb(var(--colour-negative)); }
#plate[data-kind="diagram"] { padding: 36px 0; }
#plate[data-kind="field"] { padding: 0; }
#stage { width: 100%; }
.cap { display: grid; gap: 2px; padding-top: 9px; }
#means { color: rgb(var(--colour-main-500)); text-wrap: pretty; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 1ch; padding-top: 18px; }
button { font: inherit; color: rgb(var(--colour-main)); background: rgb(var(--colour-main-200)); border: 0; padding: 4px 1ch; cursor: pointer; }
button:hover { background: rgb(var(--colour-main-300)); }
button:focus-visible, input:focus-visible { outline: 1px solid rgb(var(--colour-main)); outline-offset: 2px; }
#scrub { flex: 1 1 160px; min-width: 120px; accent-color: rgb(var(--colour-main)); }
#read { margin-left: auto; color: rgb(var(--colour-main-500)); font-variant-numeric: tabular-nums; }
#error { display: none; margin-top: 18px; padding: 9px 1ch; background: rgb(var(--colour-main)); color: rgb(var(--colour-negative)); white-space: pre-wrap; }

  <div class="bar">
    <button type="button" id="play">Pause</button>
    <button type="button" id="next" hidden>Next</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub">

  </div>

<script>
(function () {
